version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for everything so peer dependencies (vite/vitest/wrangler and their plugins)
    # are bumped together and resolved as a set; separate PRs can leave the lockfile in an
    # unresolvable state that breaks `npm clean-install` in Cloudflare builds.
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

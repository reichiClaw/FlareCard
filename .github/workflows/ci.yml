name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Same command Cloudflare's Git integration runs; fails on lockfile drift or peer conflicts.
      - run: npm clean-install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

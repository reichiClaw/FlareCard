# Keeps FlareCard's profile-signing certificate fresh from outside Cloudflare.
#
# Cloudflare Workers cannot talk to Let's Encrypt directly (HTTP 525, see the
# README section "Signed profiles"), so this workflow runs FlareCard's external
# ACME runner: it fetches a CSR for the key kept inside FlareCard, completes the
# http-01 challenge through FlareCard's own /.well-known/acme-challenge/ route
# and uploads the issued chain. It only renews when fewer than 30 days remain.
#
# Setup (repository → Settings → Secrets and variables → Actions):
#   Variables: FLARECARD_URL   e.g. https://contacts.example.com
#              ACME_EMAIL      optional, expiry notices from Let's Encrypt
#   Secrets:   FLARECARD_ADMIN_USER, FLARECARD_ADMIN_PASSWORD  (a FlareCard admin)
#
# The job is skipped entirely until FLARECARD_URL is set.
name: Renew profile-signing certificate

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Renew even if the current certificate is still fresh
        type: boolean
        default: false
      staging:
        description: Use the Let's Encrypt staging directory (certificates are not trusted by devices)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renew-signing-cert
  cancel-in-progress: false

jobs:
  renew:
    if: ${{ vars.FLARECARD_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Renew if due
        env:
          FLARECARD_URL: ${{ vars.FLARECARD_URL }}
          FLARECARD_ADMIN_USER: ${{ secrets.FLARECARD_ADMIN_USER }}
          FLARECARD_ADMIN_PASSWORD: ${{ secrets.FLARECARD_ADMIN_PASSWORD }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          ACME_DIRECTORY_URL: ${{ vars.ACME_DIRECTORY_URL }}
          ACME_ACCOUNT_KEY: ${{ secrets.ACME_ACCOUNT_KEY }}
        run: >
          npm run acme:renew --
          ${{ inputs.force && '--force' || '' }}
          ${{ inputs.staging && '--staging' || '' }}
